apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-repo-creator
  labels:
    app.kubernetes.io/name: gitlab-repo-creator
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-repo-creator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-repo-creator
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: gitlab-repo-creator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab-repo-creator
      containers:
        - name: gitlab-repo-creator
          image: registry.example.com/platform/gitlab-repo-creator:prod-07-15-2026
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TMPDIR
              value: /tmp
          envFrom:
            - configMapRef:
                name: gitlab-repo-creator-config
            - secretRef:
                name: gitlab-repo-creator-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
