apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-repo-creator-config
data:
  BASE_PATH: "/"
  GITLAB_API_URL: "https://gitlab.example.com/api/v4"
  GITLAB_WEB_URL: "https://gitlab.example.com"
  TEMPLATE_REPO_PREFIX: "https://gitlab.example.com/approved-templates/"
  NAMESPACE_MAP: '{"team-alpha":101,"team-beta":102}'
  TEMPLATE_MAP: '{"template-go-image":201,"template-go-library":202,"template-java-image":203,"template-java-library":204,"template-java-image-kjar":205,"template-javascript-image":206,"template-javascript-library":207}'
  CREATE_RATE_LIMIT: "5"
  GITLAB_TIMEOUT_MS: "30000"
