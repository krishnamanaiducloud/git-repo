# Documentation only. Never commit real values or apply this file unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-repo-creator-oauth
type: Opaque
stringData:
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://sso.example.com/realms/platform
  OAUTH2_PROXY_CLIENT_ID: replace-me
  OAUTH2_PROXY_CLIENT_SECRET: replace-me
  # Generate with: openssl rand -base64 32 | tr -- '+/' '-_'
  OAUTH2_PROXY_COOKIE_SECRET: replace-with-a-32-byte-base64url-secret
  OAUTH2_PROXY_REDIRECT_URL: https://platform.apps.example.com/git-repo/oauth2/callback
